  /* ---------------- export / import ---------------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
  }

  function exportJson() {
    var payload = {
      app: '이종대왕 달력',
      version: 1,
      calendar: '이종대왕 달력',
      exportedAt: new Date().toISOString(),
      count: state.events.length,
      events: state.events
    };
    download('이종대왕달력_' + todayYmd() + '.json', JSON.stringify(payload, null, 1));
    toast('JSON으로 내보냈습니다 (' + state.events.length + '개)');
  }

  function importJson() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data;
        try { data = JSON.parse(String(reader.result)); } catch (e) { toast('JSON을 읽지 못했습니다.'); return; }
        var arr = data instanceof Array ? data : (data && data.events instanceof Array ? data.events : null);
        if (!arr) { toast('이 앱의 백업 파일이 아닙니다.'); return; }
        var clean = arr.filter(function (e) { return e && validYmd(e.date); });
        if (!clean.length) { toast('가져올 기록이 없습니다.'); return; }
        chooseImport(clean);
      };
      reader.readAsText(f);
    });
    input.click();
  }

  function chooseImport(list) {
    var html = '<div class="sheet-top"><div class="grow"><p class="eyebrow">JSON 불러오기</p>' +
      '<h2 class="sheet-title">' + list.length + '개 기록을 찾았습니다</h2></div>' +
      '<button type="button" class="xbtn" data-act="close">✕</button></div><div class="sheet-body">' +
      '<p class="hint" style="margin-top:0">합치기는 같은 기록(id)은 업데이트하고 새 기록은 추가합니다. 교체는 지금 데이터를 모두 지우고 이 파일로 바꿉니다.</p>' +
      '<div class="seclabel">현재 ' + state.events.length + '개</div></div>' +
      '<div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">취소</button>' +
      '<button type="button" class="btn ghost" data-act="merge">합치기</button>' +
      '<button type="button" class="btn primary" data-act="replace">교체</button></div>';
    var ov = openSheet(html);
    ov.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'close') { closeSheet(ov); return; }
      var before = state.events.slice();
      if (act === 'merge') {
        var map = {};
        state.events.forEach(function (ev, i) { map[ev.id] = i; });
        list.forEach(function (raw) {
          var ev = normalize(raw);
          if (map[ev.id] !== undefined) state.events[map[ev.id]] = ev;
          else state.events.push(ev);
        });
        commit();
        toast(list.length + '개를 합쳤습니다', function () { state.events = before; commit(); });
      } else if (act === 'replace') {
        state.events = list.map(normalize);
        commit();
        toast(list.length + '개로 교체했습니다', function () { state.events = before; commit(); });
      }
      closeSheet(ov);
    });
  }

  /* ---------------- year shift ---------------- */
  function ymLabel(k) { return (+k.slice(0, 4)) + '년 ' + (+k.slice(5, 7)) + '월'; }

  function shiftDate(from, targetYear, mode) {
    var d = parseYmd(from);
    if (!d) return null;
    var m = d.getMonth() + 1, day = d.getDate(), dow = d.getDay();
    if (mode === 'exact') {
      var dim = daysInMonth(targetYear, m);
      var dd = Math.min(day, dim);
      var res = { date: ymd(new Date(targetYear, m - 1, dd, 12)), note: '' };
      if (dd !== day) res.note = m + '월은 ' + dim + '일까지라 ' + dd + '일로 조정';
      return res;
    }
    var nth = Math.ceil(day / 7);
    var firstDow = new Date(targetYear, m - 1, 1, 12).getDay();
    var target = 1 + ((dow - firstDow + 7) % 7) + (nth - 1) * 7;
    var dim2 = daysInMonth(targetYear, m);
    if (target > dim2) {
      var last = dim2;
      while (last > 1 && new Date(targetYear, m - 1, last, 12).getDay() !== dow) last--;
      return { date: ymd(new Date(targetYear, m - 1, last, 12)), note: '그 달에 ' + nth + '번째 ' + DOW[dow] + '요일이 없어 마지막 주로' };
    }
    return { date: ymd(new Date(targetYear, m - 1, target, 12)), note: '' };
  }

  function openShift() {
    var years = {};
    state.events.forEach(function (e) { years[String(e.date).slice(0, 4)] = 1; });
    var ys = Object.keys(years).sort();
    var srcYear = ys[ys.length - 1] || todayYmd().slice(0, 4);
    var html = '<div class="sheet-top"><div class="grow"><p class="eyebrow">다음 학년도 준비</p>' +
      '<h2 class="sheet-title">연도 배치 도우미</h2></div>' +
      '<button type="button" class="xbtn" data-act="close">✕</button></div><div class="sheet-body">' +
      '<div class="row2"><div class="field"><label class="flabel" for="sYear">원본 연도</label>' +
      '<select class="input" id="sYear">' + ys.map(function (y) {
        return '<option value="' + y + '"' + (y === srcYear ? ' selected' : '') + '>' + y + '년</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label class="flabel" for="tYear">옮길 연도</label>' +
      '<input class="input" type="number" id="tYear" value="' + (+srcYear + 1) + '" min="2000" max="2100" inputmode="numeric"></div></div>' +
      '<div class="field"><span class="flabel">배치 방식</span>' +
      '<label class="radio on"><input type="radio" name="smode" value="weekday" checked>' +
      '<span><b>같은 요일 · 몇째 주</b><i>3월 둘째 금요일 → 내년 3월 둘째 금요일 (요일 리듬 유지)</i></span></label>' +
      '<label class="radio"><input type="radio" name="smode" value="exact">' +
      '<span><b>같은 날짜</b><i>3월 6일 → 내년 3월 6일 (날짜 그대로)</i></span></label></div>' +
      '<label class="checkline"><input type="checkbox" id="sDone" checked> 완료한 기록도 포함</label>' +
      '<label class="checkline"><input type="checkbox" id="sKeep" checked> 원본 기록 유지 (복사해서 배치)</label>' +
      '<button type="button" class="btn primary block" data-act="preview" style="margin-top:8px">미리보기</button>' +
      '<div id="shiftPreview"></div></div>' +
      '<div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">닫기</button>' +
      '<button type="button" class="btn primary" data-act="apply" disabled>배치 적용</button></div>';
    var ov = openSheet(html);
    var rows = [];

    function modeNow() {
      var r = ov.querySelector('input[name="smode"]:checked');
      return r ? r.value : 'weekday';
    }

    ov.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      var applyBtn = ov.querySelector('[data-act="apply"]');
      if (act === 'close') closeSheet(ov);
      else if (act === 'preview') {
        var target = parseInt($('#tYear', ov).value, 10);
        var src = $('#sYear', ov).value;
        if (!target || target < 2000 || target > 2100) { toast('옮길 연도를 확인해 주세요.'); return; }
        if (String(target) === src) { toast('같은 연도입니다. 다른 연도를 골라 주세요.'); return; }
        var includeDone = $('#sDone', ov).checked;
        var mode = modeNow();
        rows = state.events.filter(function (ev) {
          return String(ev.date).slice(0, 4) === src && (includeDone || !ev.done);
        }).sort(function (a, b2) { return a.date < b2.date ? -1 : a.date > b2.date ? 1 : 0; }).map(function (ev) {
          var r = shiftDate(ev.date, target, mode);
          var rEnd = ev.end ? shiftDate(ev.end, target, mode) : null;
          return {
            id: ev.id,
            title: ev.title,
            from: ev.date,
            to: r ? r.date : null,
            toEnd: rEnd ? rEnd.date : null,
            note: r ? r.note : '날짜를 계산할 수 없음',
            ok: !!r,
            checked: !!r
          };
        });
        var okCount = rows.filter(function (x) { return x.ok; }).length;
        var box = $('#shiftPreview', ov);
        if (!rows.length) {
          box.innerHTML = '<p class="hint">옮길 기록이 없습니다.</p>';
          applyBtn.disabled = true;
          return;
        }
        box.innerHTML = '<div class="shift-summary">대상 <b>' + rows.length + '</b>개 · 배치 가능 <b>' + okCount + '</b>개 · 선택 <b id="shiftSel">' + okCount + '</b>개</div>' +
          rows.map(function (r, i) {
            var dateCell = r.ok
              ? '<span class="sdate">' + esc(fmtShort(r.from)) + '<em>→ ' + esc(fmtShort(r.to)) + '</em></span>'
              : '<span class="sdate">' + esc(fmtShort(r.from)) + '<em>배치 불가</em></span>';
            var note = r.note ? '<span class="note">' + esc(r.note) + '</span>' : '';
            return '<label class="srow' + (r.ok ? '' : ' bad') + '">' +
              '<input type="checkbox" data-row="' + i + '"' + (r.checked ? ' checked' : '') + (r.ok ? '' : ' disabled') + '>' +
              dateCell + '<span class="stitle">' + esc(r.title || '(제목 없음)') + note + '</span></label>';
          }).join('');
        applyBtn.disabled = okCount === 0;
        applyBtn.textContent = '배치 적용 (' + okCount + '개)';
      } else if (act === 'apply') {
        var chosen = rows.filter(function (r) { return r.ok && r.checked; });
        if (!chosen.length) { toast('배치할 기록을 선택해 주세요.'); return; }
        var keep = $('#sKeep', ov).checked;
        var before = state.events.slice();
        var created = [];
        chosen.forEach(function (r) {
          var src = findEv(r.id);
          if (!src) return;
          var copy = normalize(clone(src));
          copy.id = uid('e');
          copy.date = r.to;
          copy.done = false;
          if (r.toEnd && src.end) copy.end = r.toEnd; else delete copy.end;
          created.push(copy);
        });
        if (!keep) {
          var ids = chosen.map(function (r) { return r.id; });
          state.events = state.events.filter(function (ev) { return ids.indexOf(ev.id) < 0; });
        }
        state.events = state.events.concat(created);
        if (created.length) {
          var firstDate = created.map(function (c) { return c.date; }).sort()[0];
          if (firstDate) ui.ym = ymOf(firstDate);
        }
        commit();
        closeSheet(ov);
        toast(created.length + '개를 옮겨 배치했습니다', function () {
          state.events = before;
          commit();
        });
      }
    });

    ov.addEventListener('change', function (e) {
      var t = e.target;
      if (t.name === 'smode') {
        $$('.radio', ov).forEach(function (lab) {
          lab.classList.toggle('on', lab.querySelector('input').checked);
        });
      }
      if (t.hasAttribute('data-row')) {
        var i = +t.getAttribute('data-row');
        if (rows[i]) rows[i].checked = t.checked;
        var sel = $('#shiftSel', ov);
        if (sel) sel.textContent = rows.filter(function (r) { return r.ok && r.checked; }).length;
        var applyBtn = ov.querySelector('[data-act="apply"]');
        var n = rows.filter(function (r) { return r.ok && r.checked; }).length;
        applyBtn.textContent = '배치 적용 (' + n + '개)';
        applyBtn.disabled = n === 0;
      }
    });
  }

  /* ---------------- month picker ---------------- */
  function pickerHtml(year) {
    var counts = {};
    state.events.forEach(function (e) { counts[ymOf(e.date)] = (counts[ymOf(e.date)] || 0) + 1; });
    var cur = ui.ym;
    var html = '<div class="sheet-top"><div class="grow"><p class="eyebrow">연월 선택</p>' +
      '<h2 class="sheet-title">' + year + '년</h2></div>' +

      '<b>' + year + '년</b><button type="button" class="nav-btn" data-y="' + (year + 1) + '">›</button></div>' +
      '<div class="mp-grid">';
    for (var m = 1; m <= 12; m++) {
      var k = year + '-' + pad(m);
      var on = k === cur;
      var has = !!counts[k];
      html += '<button type="button" class="' + (on ? 'on' : has ? 'has' : '') + '" data-m="' + k + '">' + m + '월' +
        (has ? '<span style="display:block;font-size:10px;font-weight:600;opacity:.65">' + counts[k] + '</span>' : '') + '</button>';
    }
    html += '</div></div>';
    return html;
  }

  function openPicker() {
    var year = +ui.ym.slice(0, 4);
    var ov = openSheet(pickerHtml(year));
    ov.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act], [data-m], [data-y]');
      if (!b) return;
      if (b.hasAttribute('data-y')) {
        year = +b.getAttribute('data-y');
        ov.querySelector('.sheet').innerHTML = pickerHtml(year);
        return;
      }
      if (b.hasAttribute('data-m')) {
        ui.ym = b.getAttribute('data-m');
        if (ui.view === 'list') pendingListScroll = true;
        saveState();
        closeSheet(ov);
        render();
        return;
      }
      if (b.getAttribute('data-act') === 'close') closeSheet(ov);
    });
  }

  /* ---------------- global events ---------------- */
  function bind() {
    $('#viewSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-view]');
      if (!b) return;
      ui.view = b.getAttribute('data-view');
      if (ui.view === 'list') pendingListScroll = true;
      saveState();
      render();
    });

    $('#btnPrev').addEventListener('click', function () { stepMonth(-1); });
    $('#btnNext').addEventListener('click', function () { stepMonth(1); });
    $('#btnToday').addEventListener('click', function () {
      var t = ymOf(todayYmd());
      ui.ym = t;
      if (ui.view === 'list') pendingListScroll = true;
      saveState();
      render();
      var cell = $('#grid .cell.today');
      if (cell && cell.scrollIntoView) cell.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    $('#btnMonthPick').addEventListener('click', openPicker);
    $('#btnSettings').addEventListener('click', openSettings);
    $('#btnAdd').addEventListener('click', function () {
      var d = todayYmd();
      if (ui.view === 'month' && ymOf(todayYmd()) !== ui.ym) d = ui.ym + '-01';
      openEdit(null, null, d);
    });

    var searchTimer = null;
    $('#searchInput').addEventListener('input', function (e) {
      var v = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        ui.q = v.trim();
        renderStatus();
        renderChips();
        if (ui.view === 'month') renderMonth(); else renderList();
        $('#searchClear').hidden = !ui.q;
      }, 120);
    });
    $('#searchInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
        if (ui.q) { ui.view = 'list'; saveState(); render(); }
      }
      if (e.key === 'Escape') { ui.q = ''; e.target.value = ''; render(); }
    });
    $('#searchClear').addEventListener('click', function () {
      ui.q = '';
      $('#searchInput').value = '';
      render();
    });

    $('#chips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tag], [data-chipmore]');
      if (!b) return;
      if (b.hasAttribute('data-chipmore')) { ui.chipsOpen = !ui.chipsOpen; renderChips(); return; }
      var t = b.getAttribute('data-tag');
      ui.tag = ui.tag === t ? '' : t;
      render();
    });

    $('#btnHideDone').addEventListener('click', function () {
      ui.hideDone = !ui.hideDone;
      saveState();
      render();
    });

    $('#btnSort').addEventListener('click', function () {
      ui.sortAsc = !ui.sortAsc;
      saveState();
      render();
    });

    $('#grid').addEventListener('click', function (e) {
      var chk = e.target.closest('[data-pchk]');
      if (chk) { e.stopPropagation(); toggleDone(chk.getAttribute('data-pchk')); return; }
      var pill = e.target.closest('[data-ev]');
      if (pill) { openDetail(pill.getAttribute('data-ev')); return; }
      var more = e.target.closest('[data-more]');
      if (more) { openDay(more.getAttribute('data-more')); return; }
      var cell = e.target.closest('[data-day]');
      if (cell) openDay(cell.getAttribute('data-day'));
    });

    $('#list').addEventListener('click', function (e) {
      var chk = e.target.closest('[data-chk]');
      if (chk) {
        e.stopPropagation();
        toggleDone(chk.getAttribute('data-chk'));
        return;
      }
      var row = e.target.closest('[data-ev]');
      if (row) openDetail(row.getAttribute('data-ev'));
    });

    /* drag & drop (desktop) */
    var dragId = null;
    $('#grid').addEventListener('dragstart', function (e) {
      var pill = e.target.closest('[data-ev]');
      if (!pill) return;
      dragId = pill.getAttribute('data-ev');
      pill.classList.add('dragging');
      try {
        e.dataTransfer.setData('text/plain', dragId);
        e.dataTransfer.effectAllowed = 'move';
      } catch (err) {}
    });
    $('#grid').addEventListener('dragend', function (e) {
      var pill = e.target.closest('[data-ev]');
      if (pill) pill.classList.remove('dragging');
      $$('.cell.drop').forEach(function (c) { c.classList.remove('drop'); });
      dragId = null;
    });
    $('#grid').addEventListener('dragover', function (e) {
      var cell = e.target.closest('[data-day]');
      if (!cell || !dragId) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
      $$('.cell.drop').forEach(function (c) { if (c !== cell) c.classList.remove('drop'); });
      cell.classList.add('drop');
    });
    $('#grid').addEventListener('dragleave', function (e) {
      var cell = e.target.closest('[data-day]');
      if (cell) cell.classList.remove('drop');
    });
    $('#grid').addEventListener('drop', function (e) {
      var cell = e.target.closest('[data-day]');
      if (!cell) return;
      e.preventDefault();
      cell.classList.remove('drop');
      var id = dragId;
      try {
        var dt = e.dataTransfer.getData('text/plain');
        if (dt) id = dt;
      } catch (err) {}
      if (!id) return;
      var ev = findEv(id);
      if (!ev) return;
      var ds = cell.getAttribute('data-day');
      if (ev.date === ds) return;
      moveEvent(id, ds);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (modals.length) { e.preventDefault(); closeTop(); return; }
        if (ui.q) { ui.q = ''; $('#searchInput').value = ''; render(); }
        return;
      }
      var tag = (e.target && e.target.tagName) || '';
      if (modals.length || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowLeft') stepMonth(-1);
      else if (e.key === 'ArrowRight') stepMonth(1);
      else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openEdit(null, null, todayYmd()); }
    });

    var rTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(rTimer);
      rTimer = setTimeout(function () { if (ui.view === 'month') renderMonth(); }, 160);
    });

    /* storage guard */
    try {
      localStorage.setItem('ljc_probe', '1');
      localStorage.removeItem('ljc_probe');
    } catch (e) {
      storageOk = false;
      toast('이 브라우저에서는 저장이 막혀 있어 변경이 유지되지 않을 수 있어요.');
    }
  }

  function stepMonth(delta) {
    var y = +ui.ym.slice(0, 4), m = +ui.ym.slice(5, 7);
    var d = new Date(y, m - 1 + delta, 1, 12);
    ui.ym = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    if (ui.view === 'list') pendingListScroll = true;
    saveState();
    render();
  }

  /* ---------------- boot ---------------- */
  rebuildIndex();
  bind();
  render();

  try {
    if (!localStorage.getItem('ljc_onboarded')) {
      localStorage.setItem('ljc_onboarded', '1');
      setTimeout(function () {
        toast('기록 ' + state.events.length + '개를 불러왔습니다. 항목을 눌러 보세요.');
      }, 700);
    }
  } catch (e) {}

  var savedNote = localStorage.getItem(STORE_KEY);
  if (savedNote) {
    try {
      var snap = JSON.parse(savedNote);
      if (snap && snap.savedAt) {
        var dt = new Date(snap.savedAt);
        if (!isNaN(dt.getTime())) {
          // 아주 오래된 스냅샷이면 조용히 알린다 (7일 이상)
          if (Date.now() - dt.getTime() > 7 * 86400000) {
            toast('이 기기에 저장된 편집본을 불러왔습니다 (' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' 저장)');
          }
        }
      }
    } catch (e) {}
  }

  /* test hook */
  window.__ljc = {
    state: state,
    ui: ui,
    get events() { return state.events; },
    findEv: findEv,
    render: render,
    openDetail: openDetail,
    openEdit: openEdit,
    openDay: openDay,
    openSettings: openSettings,
    openShift: openShift,
    openPicker: openPicker,
    shiftDate: shiftDate,
    exportJson: exportJson,
    importJson: importJson,
    chooseImport: chooseImport,
    commit: commit,
    normalize: normalize,
    saveState: saveState,
    toast: toast,
    askConfirm: askConfirm,
    visibleEvents: visibleEvents,
    todayYmd: todayYmd,
    INITIAL: INITIAL
  };
})();

</script>
<script>
/* 공개 배포용 껍데기(shell) 동작
   - 앱 본체(app.js)는 그대로 두고, 첫 설치 안내와 빈 상태 안내만 덧붙인다.
   - 기록은 전부 이 기기(localStorage)에만 있고, 서버·저장소에는 아무것도 없다. */
(function () {
  'use strict';
  var L = window.__ljc;
  var banner = document.getElementById('ljcBanner');
  var DISMISS = 'ljc_shell_banner_off';
  var dismissed = false;
  try { dismissed = localStorage.getItem(DISMISS) === '1'; } catch (e) {}

  function isEmpty() {
    try { return !(L && L.state && L.state.events && L.state.events.length); } catch (e) { return true; }
  }

  function sync() {
    var empty = isEmpty();
    if (banner) banner.hidden = !(empty && !dismissed);
  }

  function closeBanner() {
    dismissed = true;
    try { localStorage.setItem(DISMISS, '1'); } catch (e) {}
    sync();
  }

  function openImport() {
    if (L && typeof L.importJson === 'function') { L.importJson(); return; }
    if (L && typeof L.openSettings === 'function') L.openSettings();
  }

  function openSettings() {
    if (L && typeof L.openSettings === 'function') L.openSettings();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-ljc]');
    if (!b) return;
    var act = b.getAttribute('data-ljc');
    if (act === 'close') closeBanner();
    else if (act === 'import') openImport();
    else if (act === 'settings') openSettings();
  });

  // 달력·목록을 다시 그릴 때마다(불러오기·추가·삭제 포함) 빈 상태를 갱신한다.
  ['grid', 'list'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && window.MutationObserver) {
      new MutationObserver(sync).observe(el, { childList: true });
    }
  });
  window.addEventListener('pageshow', sync);
  document.addEventListener('visibilitychange', sync);
  setTimeout(sync, 0);
  setTimeout(sync, 600);
  sync();
})();

</script>
<script>
/* 공개 배포용 껍데기(shell) 확장 기능
   1) 타임머신 스냅샷 — 지금 상태(기록·완료 표시)를 이 기기에 통째로 저장, 최근 5개, 복원/삭제
   2) 구글 시트 클라우드 동기화 — Apps Script 웹 앱 주소로 저장/불러오기
   모든 데이터는 이 기기 또는 사용자가 지정한 본인 구글 시트로만 갑니다. 앱이 다른 곳으로 보내지 않습니다. */
(function () {
  'use strict';
  var L = window.__ljc;
  if (!L) return;

  var SNAP_KEY = 'ljc_snaps_v1';
  var URL_KEY = 'ljc_sheet_url';
  var LAST_KEY = 'ljc_sheet_last';
  var MAX_SNAPS = 5;
  var MAX_CHARS = 4000000;   // localStorage 한도(≈5MB) 안에서 안전하게

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(m, undo) { if (L.toast) L.toast(m, undo); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtAt(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' (' + DOW[d.getDay()] + ') ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function validYmd(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return false;
    var p = String(s).split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2], 12);
    return !isNaN(d.getTime()) && d.getFullYear() === +p[0] && d.getMonth() + 1 === +p[1] && d.getDate() === +p[2];
  }

  /* ------------------------------------------------ snapshots (localStorage) */
  function readSnaps() {
    try {
      var a = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function totalChars(list) {
    var n = 0;
    for (var i = 0; i < list.length; i++) n += (list[i]._len || 0);
    return n;
  }
  function writeSnaps(list) {
    // _len 은 저장하지 않는다(용량 계산용 임시값)
    var plain = list.map(function (s) {
      var o = {};
      for (var k in s) if (k !== '_len') o[k] = s[k];
      return o;
    });
    localStorage.setItem(SNAP_KEY, JSON.stringify(plain));
  }
  function measured(list) {
    return list.map(function (s) {
      var o = {};
      for (var k in s) o[k] = s[k];
      try { o._len = JSON.stringify(o).length; } catch (e) { o._len = 0; }
      return o;
    });
  }
  function counts(events) {
    var done = 0;
    (events || []).forEach(function (e) { if (e && e.done) done++; });
    return { n: (events || []).length, done: done };
  }

  function saveSnapshot() {
    var ev = (L.state && L.state.events) || [];
    if (!ev.length) { toast('저장할 기록이 없습니다'); return; }
    var nameEl = $('#ljcSnapName');
    var label = (nameEl && nameEl.value || '').trim();
    var at = new Date().toISOString();
    var c = counts(ev);
    var snap = {
      v: 1,
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      at: at,
      label: label || (fmtAt(at) + ' 시점'),
      count: c.n,
      done: c.done,
      events: JSON.parse(JSON.stringify(ev))
    };

    var list = measured(readSnaps());
    list.unshift(measured([snap])[0]);
    if (list.length > MAX_SNAPS) list = list.slice(0, MAX_SNAPS);

    var dropped = 0;
    while (list.length) {
      if (totalChars(list) > MAX_CHARS && list.length > 1) { list.pop(); dropped++; continue; }
      try { writeSnaps(list); break; }
      catch (err) {
        if (list.length > 1) { list.pop(); dropped++; continue; }
        toast('이 브라우저의 저장 공간이 부족해 스냅샷을 저장하지 못했습니다. (설정 → JSON 내보내기로 백업하세요)');
        return;
      }
    }
    if (nameEl) nameEl.value = '';
    renderSnapList();
    toast(dropped
      ? '스냅샷을 저장했습니다. 공간이 부족해 오래된 ' + dropped + '개를 정리했습니다 (' + c.n + '개 기록)'
      : '스냅샷을 저장했습니다 (' + c.n + '개 기록)');
  }

  function restoreSnapshot(id) {
    var snap = readSnaps().filter(function (s) { return s.id === id; })[0];
    if (!snap) { toast('스냅샷을 찾지 못했습니다'); return; }
    if (!L.askConfirm) return;
    L.askConfirm('이 시점으로 되돌리기',
      snap.label + ' · 기록 ' + snap.count + '개의 상태로 돌아갑니다. 지금 편집한 내용은 사라지지만, 되돌리기(실행 취소)를 누르면 복구됩니다.',
      '복원', function () {
        var before = (L.state.events || []).slice();
        L.state.events = (snap.events || []).map(L.normalize);
        L.commit();
        toast(snap.count + '개 기록으로 되돌렸습니다', function () {
          L.state.events = before;
          L.commit();
        });
        closeSettings();
      }, true);
  }

  function deleteSnapshot(id) {
    var snap = readSnaps().filter(function (s) { return s.id === id; })[0];
    if (!snap) return;
    var list = readSnaps().filter(function (s) { return s.id !== id; });
    try { writeSnaps(measured(list)); } catch (e) {}
    renderSnapList();
    toast('스냅샷을 삭제했습니다');
  }

  function snapListHtml() {
    var list = readSnaps();
    if (!list.length) {
      return '<p class="x-none">아직 저장한 스냅샷이 없습니다. 큰 정리(연도 배치·되돌리기 많은 날) 전에 한 번씩 저장해 두세요.</p>';
    }
    return list.map(function (s) {
      return '<div class="x-snap">' +
        '<div class="x-snap-info">' +
        '<b>' + esc(s.label || fmtAt(s.at)) + '</b>' +
        '<span>' + esc(fmtAt(s.at)) + ' · 기록 <b>' + (s.count || (s.events || []).length) + '</b>개 · 완료 <b>' + (s.done || 0) + '</b>개</span>' +
        '</div>' +
        '<div class="x-snap-acts">' +
        '<button type="button" class="btn sm ghost" data-x="snapRestore" data-id="' + esc(s.id) + '">복원</button>' +
        '<button type="button" class="btn sm danger" data-x="snapDelete" data-id="' + esc(s.id) + '">삭제</button>' +
        '</div></div>';
    }).join('');
  }

  function renderSnapList() {
    var box = $('#ljcSnapList');
    if (box) box.innerHTML = snapListHtml();
  }

  function closeSettings() {
    var box = $('#ljcSnapList');
    var sheet = box && box.closest ? box.closest('.sheet') : null;
    var x = sheet && sheet.querySelector('[data-act="close"]');
    if (x) x.click();
  }

  /* ------------------------------------------------ google sheets sync */
  function getUrl() {
    var el = $('#ljcSheetUrl');
    var v = el ? el.value.trim() : '';
    if (!v) { try { v = localStorage.getItem(URL_KEY) || ''; } catch (e) { v = ''; } }
    return v;
  }
  function setStatus(msg, kind) {
    var el = $('#ljcSheetStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'x-status' + (kind ? ' ' + kind : '');
  }
  function lastSyncText() {
    var v = '';
    try { v = localStorage.getItem(LAST_KEY) || ''; } catch (e) {}
    return v ? '마지막 백업: ' + fmtAt(v) : '아직 백업하지 않았습니다.';
  }
  function checkUrl(url) {
    if (!url) { setStatus('Apps Script 웹 앱 주소를 먼저 붙여 넣으세요.', 'err'); return false; }
    if (!/^https?:\/\//i.test(url)) {
      setStatus('http:// 또는 https:// 로 시작하는 주소를 넣으세요. (Apps Script 는 https://script.google.com/macros/s/…/exec)', 'err');
      return false;
    }
    var isLocal = /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//i.test(url);
    if (!/^https:\/\//i.test(url) && !isLocal) {
      setStatus('https 주소가 아닙니다. Apps Script 웹 앱 주소는 https://script.google.com/…/exec 입니다.', 'err');
      return false;
    }
    return true;
  }
  function callSheet(url, payload) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      var d;
      try { d = JSON.parse(t); } catch (e) {
        throw new Error('응답을 읽지 못했습니다. 배포 주소(/exec)와 액세스 권한(모든 사용자)을 확인하세요.');
      }
      if (d && d.ok === false) throw new Error(d.error || '시트 쪽에서 거부했습니다.');
      return d;
    });
  }
  function busy(on) {
    ['sheetSave', 'sheetLoad'].forEach(function (a) {
      var b = document.querySelector('[data-x="' + a + '"]');
      if (b) b.disabled = !!on;
    });
  }

  function sheetSave() {
    var url = getUrl();
    if (!checkUrl(url)) return;
    try { localStorage.setItem(URL_KEY, url); } catch (e) {}
    var ev = (L.state && L.state.events) || [];
    if (!ev.length) { setStatus('이 기기에 기록이 없어 백업할 내용이 없습니다.', 'err'); return; }
    var c = counts(ev);
    busy(true);
    setStatus('시트로 저장하는 중… (' + c.n + '개)');
    callSheet(url, {
      action: 'save',
      app: '이종대왕 달력',
      version: 1,
      calendar: '이종대왕 달력',
      savedAt: new Date().toISOString(),
      count: c.n,
      events: ev
    }).then(function (d) {
      var at = d.updatedAt || d.savedAt || new Date().toISOString();
      try { localStorage.setItem(LAST_KEY, at); } catch (e) {}
      setStatus('마지막 백업: ' + fmtAt(at) + (d.count ? ' · 시트 ' + d.count + '개' : ''), 'ok');
      toast('구글 시트에 저장했습니다 (' + (d.count || c.n) + '개)' + (d.sheetUrl ? '' : ''));
      busy(false);
    }).catch(function (err) {
      var m = (err && err.message) ? err.message : '알 수 없는 오류';
      var hint = /Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)
        ? ' — 주소가 정확한지, 배포 액세스가 "모든 사용자"인지 확인하세요.' : '';
      setStatus('저장 실패: ' + m + hint, 'err');
      toast('구글 시트 저장에 실패했습니다');
      busy(false);
    });
  }

  function sheetLoad() {
    var url = getUrl();
    if (!checkUrl(url)) return;
    try { localStorage.setItem(URL_KEY, url); } catch (e) {}
    busy(true);
    setStatus('시트에서 불러오는 중…');
    callSheet(url, { action: 'load' }).then(function (d) {
      var arr = d && (d.events instanceof Array ? d.events : null);
      if (!arr) throw new Error('시트 응답에 events 가 없습니다.');
      var clean = arr.filter(function (e) { return e && validYmd(e.date); });
      busy(false);
      if (!clean.length) { setStatus('시트에 저장된 기록이 없습니다.', 'err'); return; }
      if (d.savedAt) { try { localStorage.setItem(LAST_KEY, d.savedAt); } catch (e) {} }
      setStatus('시트에서 ' + clean.length + '개를 가져왔습니다. 합치기/교체를 고르세요.', 'ok');
      closeSettings();
      if (L.chooseImport) L.chooseImport(clean);
    }).catch(function (err) {
      var m = (err && err.message) ? err.message : '알 수 없는 오류';
      var hint = /Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)
        ? ' — 주소가 정확한지, 배포 액세스가 "모든 사용자"인지 확인하세요.' : '';
      setStatus('불러오기 실패: ' + m + hint, 'err');
      toast('구글 시트에서 불러오지 못했습니다');
      busy(false);
    });
  }

  /* ------------------------------------------------ settings block */
  function settingsHtml() {
    var url = '';
    try { url = localStorage.getItem(URL_KEY) || ''; } catch (e) {}
    return '' +
      '<div class="seclabel">타임머신 스냅샷 <span class="cnt">최근 ' + MAX_SNAPS + '개</span></div>' +
      '<p class="hint" style="margin-top:0">지금 상태(기록·완료 표시)를 통째로 이 기기에 저장합니다. 연도 배치나 큰 정리 전에 한 번 저장해 두면 그 시점으로 되돌릴 수 있어요.</p>' +
      '<div class="x-inline">' +
      '<input class="input" id="ljcSnapName" type="text" placeholder="이름 (선택, 예: 11월 마무리)" autocomplete="off" aria-label="스냅샷 이름">' +
      '<button type="button" class="btn primary sm" data-x="snapSave">지금 이 순간 상태 저장</button>' +
      '</div>' +
      '<div id="ljcSnapList" class="x-list">' + snapListHtml() + '</div>' +

      '<div class="seclabel">구글 시트 클라우드 동기화</div>' +
      '<p class="hint" style="margin-top:0">구글 시트에 백업하면 휴대폰을 바꾸거나 브라우저 데이터를 지워도 기록이 남고, 시트에서 직접 열어 볼 수도 있습니다. 구글 시트 → 확장 프로그램 → Apps Script 에 <b>Code.gs</b>를 붙여 넣고 웹 앱으로 배포한 뒤, 그 주소를 아래에 넣으세요.</p>' +
      '<input class="input" id="ljcSheetUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(url) + '" aria-label="Apps Script 웹 앱 주소">' +
      '<div class="x-inline" style="margin-top:8px">' +
      '<button type="button" class="btn soft sm" data-x="sheetSave">시트로 저장 (백업)</button>' +
      '<button type="button" class="btn ghost sm" data-x="sheetLoad">시트에서 불러오기</button>' +
      '</div>' +
      '<p class="x-status" id="ljcSheetStatus">' + esc(lastSyncText()) + '</p>';
  }

  /* ------------------------------------------------ wiring */
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-x]');
    if (!b) return;
    var act = b.getAttribute('data-x');
    if (act === 'snapSave') { e.preventDefault(); saveSnapshot(); }
    else if (act === 'snapRestore') { e.preventDefault(); restoreSnapshot(b.getAttribute('data-id')); }
    else if (act === 'snapDelete') { e.preventDefault(); deleteSnapshot(b.getAttribute('data-id')); }
    else if (act === 'sheetSave') { e.preventDefault(); sheetSave(); }
    else if (act === 'sheetLoad') { e.preventDefault(); sheetLoad(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'ljcSheetUrl') {
      try { localStorage.setItem(URL_KEY, t.value.trim()); } catch (err) {}
    }
  });

  window.__ljcX = {
    settingsHtml: settingsHtml,
    saveSnapshot: saveSnapshot,
    restoreSnapshot: restoreSnapshot,
    sheetSave: sheetSave,
    sheetLoad: sheetLoad,
    readSnaps: readSnaps
  };
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
}
</script>
</body>
